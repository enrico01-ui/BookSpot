name: BookSpot CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookspot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookspot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      
      - name: Create test environment
        shell: bash
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=4000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/bookspot_test
          REDIS_URL=redis://localhost:6379
          CORS_ORIGIN=http://localhost:5173
          JWT_SECRET=ci-only-jwt-secret-not-for-production
          REFRESH_SECRET=ci-only-refresh-secret-not-for-production
          EOF



      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
      
      
      - name: Run database migrations
        run: node --env-file=.env.test ./node_modules/prisma/build/index.js migrate deploy


      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build